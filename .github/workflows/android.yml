name: Godot Android Export
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Comprobar archivos obligatorios
        run: |
          test -s project.godot
          test -s scenes/game.tscn
          test -s scripts/game.gd
          test -s export_presets.cfg
      - name: Importar recursos y comprobar proyecto
        run: godot --headless --path . --editor --quit
      - name: Generar APK de prueba
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/NEON_CAT_STATION_X.apk
          test -s build/NEON_CAT_STATION_X.apk
          unzip -t build/NEON_CAT_STATION_X.apk | tail -1
      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: NEON_CAT_STATION_X-APK
          path: build/NEON_CAT_STATION_X.apk
          if-no-files-found: error
